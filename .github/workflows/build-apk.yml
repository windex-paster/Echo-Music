name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - '**'

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Echo Music Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

      - name: Ensure Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build Universal Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossDebug assembleUniversalGmsDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Music-Debug-APK
          path: |
            app/build/outputs/apk/**/debug/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
